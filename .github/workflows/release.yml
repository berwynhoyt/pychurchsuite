# Build and publish a release to PyPI when a version tag like v1.3.0 is pushed.
# PyPI trusts this workflow through "Trusted Publishing", so no API token is stored anywhere.
# See RELEASING.md for the one-time setup on PyPI and GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Build source archive and wheel
        run: uv build

      - name: Check that the tag matches the package version
        run: |
          test -f "dist/pychurchsuite-${GITHUB_REF_NAME#v}-py3-none-any.whl" ||
            { echo "::error::Tag $GITHUB_REF_NAME does not match __version__ in churchsuite/__init__.py"; exit 1; }

      - name: Check that PyPI can render the metadata and README
        run: uvx twine check dist/*

      - name: Test that the wheel installs and runs
        run: uvx --from dist/pychurchsuite-*.whl docexport --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI verify this workflow instead of needing an API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10

      - name: Publish to PyPI
        run: uv publish
